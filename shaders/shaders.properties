# Optimización para Apple Silicon M1 (Metal translation layer)
shadowMapResolution=0
sunPathRotation=-25.0
ambientOcclusionLevel=1.0
handDepthMul=0.125
oldHandLight=false

# ============================================================================
#  Ajustes de pipeline para GPU TBDR (Apple M1)
# ============================================================================
# Sin pases composite/deferred ni shadow: todo se resuelve en gbuffers -> 1 pase,
# el framebuffer nunca sale de la memoria de tile.
oldLighting=false
separateAo=false
# Nubes rápidas: las fancy duplican capas translúcidas (overdraw caro en TBDR)
clouds=fast
# Sol y luna redondos procedurales (gbuffers_skytextured)
sun=true
moon=true
# Evita escrituras de profundidad extra en lluvia y rayos de faro
rain.depth=false
beacon.beam.depth=false
frustum.culling=true

# ============================================================================
#  Custom uniforms: se calculan en CPU UNA vez por frame.
#  Antes cada píxel recalculaba normalize(sol), dot(sol, cenit), tintes, etc.
#  Ahora la GPU solo lee constantes -> cero ALU por píxel para la hora del día.
# ============================================================================

# Elevación del sol: sin(ángulo) * cos(sunPathRotation = 25°)
variable.float.sunElev = sin(sunAngle * 6.2831853) * 0.9063078
variable.float.dayF = clamp((sunElev + 0.05) / 0.15, 0.0, 1.0)
variable.float.setF = clamp(1.0 - abs(sunElev) * 6.5, 0.0, 1.0)

uniform.float.dayFactor = dayF
uniform.float.sunsetFactor = setF
uniform.float.celestialSign = if(sunAngle < 0.5, 1.0, -1.0)
# día 0.20 / noche 0.04
uniform.float.celestialStrength = 0.04 + 0.16 * dayF

# Tinte atmosférico: mix(noche, día, dayF) y luego mix(..., atardecer, setF)
variable.float.tR = 0.60 + 0.45 * dayF
variable.float.tG = 0.72 + 0.26 * dayF
variable.float.tB = 1.05 - 0.17 * dayF
uniform.vec3.skyTint = vec3(tR + (1.18 - tR) * setF, tG + (0.74 - tG) * setF, tB + (0.46 - tB) * setF)

# Antorcha en mano (principal o segunda mano)
variable.float.hl = max(heldBlockLightValue, heldBlockLightValue2) / 15.0
uniform.float.handLight = hl
uniform.float.handSide = if(heldBlockLightValue2 > heldBlockLightValue, -0.35, 0.35)
uniform.float.handInvRadius = 1.0 / max(hl * 16.5, 0.001)